<!-- Hardal tracker: put this once in the <head> of every page. Fake example IDs. -->
<script
  async
  src="https://analytics.example.com/tracker.js"
  data-tenant-id="11111111-1111-4111-8111-111111111111"
  data-source-id="22222222-2222-4222-8222-222222222222">
</script>

<!-- Optional attributes:
  data-auto-track="false"   turn off automatic page_view, scroll, scroll_depth, outbound_click
  data-spa="false"          turn off page_view on History API and hash route changes
  data-consent="granted"    starting consent when the saved choice is already known ("granted" or "denied")
  data-host-url="https://…" send events to another origin than the script's
  data-global-name="myAnalytics"  extra global name; window.hrd stays available
-->
